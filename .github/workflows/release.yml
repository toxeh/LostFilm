name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0). Leave empty to only build artifacts.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > LostFilmApp/app/keystore.jks
            echo "Keystore decoded successfully"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set; falling back to runner debug keystore"
          fi

      - name: Run unit tests
        working-directory: LostFilmApp
        run: gradle testDebugUnitTest --no-daemon

      - name: Build release APKs
        working-directory: LostFilmApp
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Clean up keystore
        if: always()
        run: rm -f LostFilmApp/app/keystore.jks

      - name: List built APKs
        run: ls -lh LostFilmApp/app/build/outputs/apk/release/*.apk

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lostfilm-atv-apks
          path: LostFilmApp/app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          fi
          TITLE="LostFilm ATV ${TAG}"
          APKS=(
            LostFilmApp/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            LostFilmApp/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            LostFilmApp/app/build/outputs/apk/release/app-universal-release.apk
          )

          TAG_MSG=$(git tag -l --format='%(contents)' "$TAG" || true)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${APKS[@]}" --clobber
          elif [ -n "$TAG_MSG" ]; then
            gh release create "$TAG" "${APKS[@]}" --title "$TITLE" --notes "$TAG_MSG"
          else
            gh release create "$TAG" "${APKS[@]}" --title "$TITLE" --generate-notes
          fi
